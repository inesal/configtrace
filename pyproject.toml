[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "configtrace"
version = "0.1.0"
description = "Check named secret references across deployment configuration files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
configtrace = "configtrace.cli:main"

[tool.setuptools.packages.find]
include = ["configtrace*"]

